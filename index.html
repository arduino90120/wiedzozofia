<script>
  // Registering the service worker for PWA functionality
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/service_worker.js')
        .then(function(registration) {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
      }, function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
    });
  }

  // Detecting platform and environment
  const userAgent = navigator.userAgent.toLowerCase();
  if (userAgent.includes("android")) {
    console.log("Running on Android");
  } else if (userAgent.includes("iphone") || userAgent.includes("ipad")) {
    console.log("Running on iOS");
  } else if (userAgent.includes("windows phone")) {
    console.log("Running on Windows Phone");
  } else if (userAgent.includes("windows") && userAgent.includes("mobile")) {
    console.log("Running on Windows 10 Mobile");
  } else if (userAgent.includes("windows")) {
    console.log("Running on Windows");
  } else if (userAgent.includes("mac os")) {
    console.log("Running on macOS");
  } else if (userAgent.includes("linux")) {
    console.log("Running on Linux/Unix");
  } else if (userAgent.includes("symbian") || userAgent.includes("s60") || userAgent.includes("series60") || userAgent.includes("series40")) {
    console.log("Running on Symbian (S60/S40)");
  } else {
    console.log("Running on an unsupported platform");
  }
</script>
